[package]
name = "gitdeck-windows"
version = "0.1.12"
edition = "2021"

[lib]
name = "gitdeck_windows_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
portable-pty = "0.8"

[profile.release]
opt-level = "s"
lto = true
